<div class="container-narrow">
  <div class="breadcrumb">
    <a href="{root}index.html">首頁</a>
    <span class="sep">/</span>
    <a href="{root}categories/{category_slug}.html">{category}</a>
    <span class="sep">/</span>
    <span>{title}</span>
  </div>

  <div class="article-header">
    <h1>{title}</h1>
    <div class="meta">
      <span>{date}</span>
      <span><a href="{root}authors/{author_slug}.html">{author}</a></span>
      <span>{reading_time} min</span>
      <a href="{source_url}" target="_blank" rel="noopener">閱讀原文 ↗</a>
    </div>
    <div class="article-tags">{tags_html}</div>
  </div>

  {series_nav}

  <div class="content">{content_html}</div>

  {related_html}
</div>
