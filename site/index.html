<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Learning — 團隊學習筆記</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F1117;--bg2:#161922;--bg3:#1E2230;--bg4:#262A38;--border:#2A2E3E;--text:#E8E8ED;--text2:#A0A4B8;--text3:#6B7084;--sage:#2D6A4F;--sage-xl:#52B788;--blue:#3B82F6;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;--mono:'SF Mono','Fira Code',monospace}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:40px 24px}
h1{font-size:28px;font-weight:800;margin-bottom:4px}
h1 em{font-style:normal;color:var(--sage-xl)}
.subtitle{font-size:14px;color:var(--text3);margin-bottom:32px}
.article-list{display:flex;flex-direction:column;gap:12px}
.article-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;color:inherit;transition:border-color .2s}
.article-card:hover{border-color:var(--sage)}
.article-meta{display:flex;gap:12px;font-size:11px;color:var(--text3);margin-bottom:8px}
.article-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.article-excerpt{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.article-tags{display:flex;gap:4px;margin-top:10px}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(45,106,79,.15);color:var(--sage-xl)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty p{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <h1>AI <em>Learning</em></h1>
  <div class="subtitle">Bombus 團隊 AI 學習筆記 — 閱讀、討論、內化</div>
  <div class="article-list" id="articles">
    <div class="empty">
      <div style="font-size:48px">📚</div>
      <p>還沒有學習筆記。<br>在 Claude Code 中輸入 <code style="color:var(--sage-xl)">/ai-learning &lt;url&gt;</code> 開始第一篇。</p>
    </div>
  </div>
</div>
<script>
// Auto-populate from content/ directory (build.py will generate articles.json)
fetch('articles.json').then(r=>r.json()).then(articles=>{
  if(!articles.length)return;
  const list=document.getElementById('articles');
  list.innerHTML='';
  articles.sort((a,b)=>b.date.localeCompare(a.date));
  articles.forEach(a=>{
    const card=document.createElement('a');
    card.className='article-card';
    card.href='articles/'+a.slug+'.html';
    card.innerHTML=`
      <div class="article-meta">
        <span>${a.date}</span>
        <span>${a.author}</span>
      </div>
      <div class="article-title">${a.title}</div>
      <div class="article-excerpt">${a.excerpt||''}</div>
      <div class="article-tags">${(a.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
    `;
    list.appendChild(card);
  });
}).catch(()=>{});
</script>
</body>
</html>
